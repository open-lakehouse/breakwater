name: Bootstrap publish

# One-time, manual first publish of a brand-new crate to crates.io.
#
# crates.io trusted publishing (OIDC), which release-plz.yml uses for every
# normal release, cannot create a crate name that does not exist yet: there is
# no crate to attach a Trusted Publisher policy to. A new publishable crate
# therefore needs exactly one token-authenticated `cargo publish` to create the
# name. After that, the maintainer registers the Trusted Publisher and OIDC
# takes over for all later releases.
#
# This workflow performs that single bootstrap step on demand. Run it once per
# new crate (dry run first), then never again for that crate. See
# CONTRIBUTING.md ("crates.io authentication") for the full flow.
#
# It publishes only: no git tag, GitHub Release or image. release-plz skips a
# version that is already on crates.io, so the crate's first tag comes with its
# next release. For olai-pdp, run docker-release.yml by hand if the bootstrapped
# version needs an image.

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Package name to bootstrap-publish (e.g. olai-pdp)"
        required: true
        type: string
      dry_run:
        description: "Run `cargo publish --dry-run` only (no upload)"
        required: false
        type: boolean
        default: true

# Least privilege: nothing at the top level.
permissions: {}

jobs:
  bootstrap-publish:
    name: Bootstrap publish ${{ inputs.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same protected environment as the OIDC release job. CARGO_REGISTRY_TOKEN
    # (a crates.io token with publish-new scope) is stored here, scoped to this
    # environment so ordinary CI can't read it.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # The toolchain the release job publishes with.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.96"
      # Some crates (olai-cedar-oci) generate code from protos at build time,
      # and `cargo publish` verifies the packaged crate by building it.
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The crate name is passed through `env` and referenced as a shell
      # variable (never expanded into the `run:` template) to avoid script
      # injection via the workflow input.
      - name: Publish (dry-run)
        if: ${{ inputs.dry_run }}
        env:
          CRATE: ${{ inputs.crate }}
        run: cargo publish -p "$CRATE" --dry-run --locked

      - name: Publish (bootstrap)
        if: ${{ !inputs.dry_run }}
        env:
          CRATE: ${{ inputs.crate }}
          # zizmor: ignore[use-trusted-publishing] bootstrapping the crate
          # name is the one publish OIDC cannot do; token auth is required here.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p "$CRATE" --locked
