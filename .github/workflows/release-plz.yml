name: Release-plz

# Automated releases. On every push to `main`, release-plz opens/updates a
# single "Release PR" containing per-crate version bumps + regenerated
# changelogs. When that PR is merged, release-plz creates the per-crate git
# tags + GitHub Releases and publishes to crates.io in dependency order
# (olai-datafusion-policy / olai-cedar-oci before olai-datafusion-policy-cedar) over
# OIDC — no registry token.
#
# olai-pdp also ships as the `ghcr.io/open-lakehouse/pdp` image: when a run
# releases it, the `docker-pdp` job builds and pushes the image from the tag
# release-plz just created (docker-release.yml, a workflow_call).
#
# All three library crates are bootstrapped and publish over OIDC. A *new* publishable
# crate needs a one-time token bootstrap + Trusted Publisher registration before
# it can release this way (bootstrap-publish.yml). See release-plz.toml and
# CONTRIBUTING.md for the flow.

on:
  push:
    branches:
      - main

# Least privilege: grant per job, nothing at the top level.
permissions: {}

jobs:
  # --- Open/update the Release PR (version bumps + changelogs) ---
  release-plz-pr:
    name: Release PR
    if: ${{ github.repository == 'open-lakehouse/breakwater' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the release-plz-* branch
      pull-requests: write # create/update the Release PR
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # release-plz needs full history to analyze commits
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.96"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run release-plz (release-pr)
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Tag + GitHub Release + cargo publish, after the Release PR is merged ---
  release-plz-release:
    name: Release
    if: ${{ github.repository == 'open-lakehouse/breakwater' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release # protected env gating the crates.io publish
    permissions:
      contents: write # create tags + GitHub Releases
      id-token: write # crates.io OIDC publish
    outputs:
      # olai-pdp's version and tag if this run released it, else empty: the
      # `docker-pdp` job keys off them.
      pdp_version: ${{ steps.pdp.outputs.version }}
      pdp_tag: ${{ steps.pdp.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.96"
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # No CARGO_REGISTRY_TOKEN: crates.io publish authenticates via OIDC
      # (`id-token: write`).
      - name: Run release-plz (release)
        id: release
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `releases` lists one object per crate released this run
      # (`package_name`, `version`, `tag`).
      - name: Detect olai-pdp release
        id: pdp
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          entry=$(printf '%s' "${RELEASES:-[]}" \
            | jq -c '.[] | select(.package_name == "olai-pdp")')
          if [ -n "$entry" ]; then
            version=$(printf '%s' "$entry" | jq -r '.version')
            tag=$(printf '%s' "$entry" | jq -r '.tag')
            echo "olai-pdp released this run: ${version} (tag ${tag})."
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "olai-pdp not released this run: image build skipped."
          fi

  # --- The pdp image, when olai-pdp was released ---
  docker-pdp:
    name: Docker release (pdp)
    needs: release-plz-release
    if: ${{ needs.release-plz-release.outputs.pdp_version != '' }}
    permissions:
      # The called workflow's merge job edits the GitHub Release, and a called
      # job may request at most what the caller grants.
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-release.yml
    with:
      image: pdp
      dockerfile: crates/pdp/Dockerfile
      tag_prefix: olai-pdp
      title: pdp
      description: A Cedar policy decision point serving olai-auth's PDP wire API
      version: ${{ needs.release-plz-release.outputs.pdp_version }}
      ref: ${{ needs.release-plz-release.outputs.pdp_tag }}
